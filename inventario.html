<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Almacén | Loreto Ingeniería</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary-blue: #263fa4; --light-blue: #eef2ff; --bg-color: #f8fafc;
            --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --danger: #dc2626; --success: #10b981; --warning: #f59e0b;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-initial { width: 35px; height: 35px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .sidebar { position: fixed; height: calc(100vh - 60px); transform: translateX(-100%); z-index: 40; } .sidebar.open { transform: translateX(0); } .header-title { display: none; } }

        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .container { max-width: 98%; margin: 0 auto; }
        
        .page-header { margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .page-header h1 { font-size: 24px; color: var(--primary-blue); margin: 0 0 5px 0; font-weight: 800; }

        .filters-bar { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); border: 1px solid var(--border-color); display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;}
        .form-input { padding: 0 16px; height: 42px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: var(--text-main); width: 100%; box-sizing: border-box; background: var(--bg-color); }
        .btn-primary { background: var(--primary-blue); color: white; border: none; height: 42px; padding: 0 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        /* Botón Flotante */
        .floating-btn {
            position: fixed; bottom: 30px; right: 30px; background: var(--primary-blue); color: white;
            width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(38, 63, 164, 0.4); z-index: 1000; transition: transform 0.2s;
        }
        #qr-counter { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

        /* Tabla */
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border-color); background: white;}
        .data-table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        .data-table th { background-color: var(--light-blue); color: var(--primary-blue); font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 12px; text-align: left; border-bottom: 2px solid var(--border-color); }
        .data-table td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-card { background: white; width: 100%; max-width: 600px; border-radius: 16px; padding: 25px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <img src="https://i.ibb.co/mC4fV6TG/LOGOTIPO-2.jpg" alt="Logo" style="height: 35px; object-fit: contain;">
            <h1 class="header-title">Almacén</h1>
        </div>
        <div class="header-right"><div class="user-initial">A</div></div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="container">
                <div class="page-header">
                    <h1>Inventario de Almacén</h1>
                    <p>Administra materiales. Selecciona conceptos para generar etiquetas QR.</p>
                </div>

                <div class="filters-bar">
                    <input type="text" class="form-input" id="filtro-buscar" placeholder="Buscar..." onkeyup="renderTabla()" style="max-width: 300px;">
                    <button class="btn-primary" onclick="abrirModalArticulo()"><i data-lucide="plus-circle"></i> Agregar</button>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Seleccionar</th>
                                <th>Nombre</th>
                                <th>Clave</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="floating-qr-btn" class="floating-btn" style="display: none;" onclick="imprimirQR()">
        <i data-lucide="qr-code"></i>
        <span id="qr-counter">0</span>
    </div>

<script>
    const firebaseConfig = { /* ... tu config ... */ };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    let dataInventario = [];

    document.addEventListener('DOMContentLoaded', () => {
        cargarInventario();
    });

    async function cargarInventario() {
        const snap = await db.collection("inventario").get();
        dataInventario = [];
        snap.forEach(doc => dataInventario.push({ id: doc.id, ...doc.data() }));
        renderTabla();
    }

    function renderTabla() {
        const tbody = document.getElementById('tabla-body');
        tbody.innerHTML = '';
        dataInventario.forEach(row => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="qr-chk" value="${row.id}" onchange="validarSeleccionQR()"></td>
                <td>${row.nombre}</td>
                <td>${row.clave}</td>
                <td><button onclick="abrirModalArticulo('${row.id}')">Editar</button></td>
            `;
            tbody.appendChild(tr);
        });
        lucide.createIcons();
    }

    function validarSeleccionQR() {
        const checked = document.querySelectorAll('.qr-chk:checked');
        const count = checked.length;
        const floatBtn = document.getElementById('floating-qr-btn');
        const counter = document.getElementById('qr-counter');
        
        if(count > 0) {
            floatBtn.style.display = 'flex';
            counter.innerText = count;
        } else {
            floatBtn.style.display = 'none';
        }
    }

    function imprimirQR() {
        const checked = document.querySelectorAll('.qr-chk:checked');
        if(checked.length === 0) return;

        const hiddenContainer = document.createElement('div');
        hiddenContainer.style.position = 'absolute';
        hiddenContainer.style.top = '0';
        hiddenContainer.style.left = '0';
        hiddenContainer.style.visibility = 'hidden';
        hiddenContainer.style.width = '750px';
        
        const wrap = document.createElement('div');
        wrap.style.width = '100%';
        wrap.style.backgroundColor = '#ffffff';

        const items = Array.from(checked).map(chk => dataInventario.find(d => d.id === chk.value)).filter(Boolean);
        const chunkSize = 10;
        
        for (let i = 0; i < items.length; i += chunkSize) {
            const chunk = items.slice(i, i + chunkSize);
            const pageDiv = document.createElement('div');
            pageDiv.style.padding = '30px';
            pageDiv.style.width = '750px';
            pageDiv.style.backgroundColor = '#ffffff';
            
            const grid = document.createElement('div');
            grid.style.display = 'flex';
            grid.style.flexWrap = 'wrap';
            grid.style.gap = '15px';
            
            chunk.forEach(item => {
                const label = document.createElement('div');
                label.style.width = '360px';
                label.style.border = '2px dashed #94a3b8';
                label.style.padding = '10px';
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.justifyContent = 'space-between';
                label.style.height = '120px';
                
                const info = document.createElement('div');
                info.style.width = '60%';
                info.innerHTML = `<div style="font-weight:900;">${item.nombre}</div><div>Clave: ${item.clave}</div>`;
                
                const qrBox = document.createElement('div');
                label.appendChild(info);
                label.appendChild(qrBox);
                grid.appendChild(label);
                
                // QR PERMANENTE basado en el ID único
                new QRCode(qrBox, { text: item.id, width: 80, height: 80 });
            });
            pageDiv.appendChild(grid);
            wrap.appendChild(pageDiv);
        }

        hiddenContainer.appendChild(wrap);
        document.body.appendChild(hiddenContainer);

        setTimeout(() => {
            html2pdf().set({
                margin: 10,
                filename: 'Etiquetas.pdf',
                jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }
            }).from(wrap).save().then(() => {
                document.body.removeChild(hiddenContainer);
            });
        }, 1000);
    }
</script>
</body>
</html>
