<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adicionales / Extraordinarios | Loreto Ingeniería</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary-blue: #263fa4; --light-blue: #eef2ff; --bg-color: #f8fafc;
            --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --danger: #dc2626; --success: #10b981; --warning: #f59e0b;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-initial { width: 35px; height: 35px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .user-dropdown { position: absolute; top: 60px; right: 15px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid var(--border-color); width: 220px; z-index: 1000; display: none; overflow: hidden; }
        .user-dropdown.show { display: block; }
        .user-card { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .user-meta .user-name { font-weight: 700; font-size: 14px; color: var(--text-main); }
        .user-actions .dropdown-link { display: flex; align-items: center; gap: 8px; padding: 12px 15px; color: var(--danger); font-size: 14px; text-decoration: none; font-weight: 500; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .sidebar { position: fixed; height: calc(100vh - 60px); transform: translateX(-100%); z-index: 40; } .sidebar.open { transform: translateX(0); } .header-title { display: none; } }

        .sidebar-nav { padding: 15px 10px; }
        .sidebar-section { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .sidebar-section:last-child { border-bottom: none; }
        .sidebar .section-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin: 10px 15px; padding-bottom: 0; display: block; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 15px; color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 8px; margin-bottom: 2px; transition: all 0.2s; }
        .nav-item:hover { background-color: var(--bg-color); }
        .nav-item.active { background-color: var(--light-blue); color: var(--primary-blue); font-weight: 700; border-left: 4px solid var(--primary-blue); }
        .nav-item.active i { color: var(--primary-blue); }

        .content { flex: 1; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 50px; }
        
        .page-header { margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; text-align: center; }
        .page-header h1 { font-size: 22px; color: var(--primary-blue); margin: 0 0 5px 0; font-weight: 800; text-transform: uppercase; }
        .page-header p { color: var(--text-muted); margin: 0; font-size: 14px; }

        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: #eef1f6; border: none; padding: 10px 20px; border-radius: 25px; font-size: 14px; font-weight: 600; color: #555; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; white-space: nowrap; }
        .tab-btn.active { background: var(--primary-blue) !important; color: #ffffff !important; }
        .tab-badge { background: #d1d5db; color: #555; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .tab-btn.active .tab-badge { background: #ffffff; color: var(--primary-blue); }

        .data-table-container { background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        thead { background: var(--light-blue); border-bottom: 1px solid var(--border-color); }
        th, td { padding: 12px 15px; font-size: 14px; color: var(--text-main); }
        tbody tr { border-bottom: 1px solid #f1f5f9; }
        .btn-edit { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }

        .form-card { background: #FFFFFF; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 24px; padding: 24px; }
        .section-title-form { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: var(--primary-blue); margin: 0 0 20px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .section-title-form i { color: var(--primary-blue); }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .form-input, .form-select, textarea.form-input { width: 100%; padding: 14px 16px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: var(--text-main); box-sizing: border-box; font-family: inherit; outline: none; transition: all 0.2s ease; }
        .form-input:focus, .form-select:focus, textarea.form-input:focus { background-color: #FFFFFF; border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(38, 63, 164, 0.1); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 640px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

        .math-result { background: var(--light-blue); padding: 15px; border-radius: 8px; border: 1px solid #c7d2fe; text-align: right; }
        .math-result label { display: block; font-size: 10px; font-weight: 700; color: var(--primary-blue); text-transform: uppercase; margin-bottom: 4px; }
        .math-result span { font-size: 20px; font-weight: 800; color: var(--primary-blue); }

        .photo-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-photo, .btn-photo-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.2s; }
        .btn-photo { background: var(--primary-blue); color: white; border: none; }
        .btn-photo:hover { background: #1a2a6e; }
        .btn-photo-secondary { background: white; color: #374151; border: 1px solid #d1d5db; }
        .photo-grid-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .photo-slot { aspect-ratio: 1; border: 2px dashed #d1d5db; border-radius: 8px; background: #f9fafb; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .remove-photo { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 24px; height: 24px; text-align: center; line-height: 22px; cursor: pointer; font-size: 16px; font-weight: bold; z-index: 10; }

        .signature-container { border: 2px dashed #d1d5db; border-radius: 8px; background: #fafafa; position: relative; margin-bottom: 10px; width: 100%; overflow: hidden; }
        .signature-pad { width: 100%; height: 200px; cursor: crosshair; touch-action: none; display: block; }

        .btn-guardar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--success); color: white; border: none; width: 100%; }
        .btn-enviar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--primary-blue); color: white; border: none; width: 100%; }

        .modal-enlarger { display: none; position: fixed !important; z-index: 999999 !important; left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; background-color: rgba(0,0,0,0.95) !important; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-enlarger.show { display: flex !important; }
        .modal-content-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; cursor: zoom-out; }
        #camera-overlay { display: none; position: fixed !important; z-index: 999999 !important; left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; background-color: rgba(0,0,0,0.95) !important; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        #camera-overlay.show { display: flex !important; }
        #camera-stream { width: 100%; max-width: 600px; aspect-ratio: 4/3; background: black; border-radius: 12px; overflow: hidden; position: relative; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        #custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-card-alert { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        #alert-icon-container { margin-bottom: 16px; display: flex; justify-content: center; }
        #alert-title { margin: 0 0 8px 0; font-size: 18px; color: var(--text-main); font-weight: 700; }
        #alert-msg { margin: 0 0 24px 0; font-size: 14px; color: var(--text-muted); line-height: 1.5; }
        #alert-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; color: white; background: var(--primary-blue); font-weight: 700; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <img src="https://i.ibb.co/mC4fV6TG/LOGOTIPO-2.jpg" alt="Logo" style="height: 35px; object-fit: contain;">
            <h1 class="header-title">Adicionales / Extraordinarios</h1>
        </div>
        <div class="header-right">
            <div class="user-initial" id="user-initial-header" onclick="document.getElementById('user-dropdown').classList.toggle('show')">U</div>
            <img src="https://i.ibb.co/8Lk54Gkb/LOGOTIPO-1.jpg" alt="User" height="35" style="border-radius:4px;">
            <div class="user-dropdown" id="user-dropdown">
                <div class="user-card"><div class="user-meta"><div class="user-name" id="user-dropdown-name">Cargando...</div></div></div>
                <div class="user-actions"><a href="index.html" class="dropdown-link" onclick="localStorage.clear();"><i data-lucide="log-out" style="width:16px;"></i> Cerrar sesión</a></div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="container">
                
                <div class="page-header">
                    <h1>Solicitud de adicionales</h1>
                    <p>Registrar y gestionar solicitudes de obra</p>
                </div>

                <div class="tabs-container">
                    <button class="tab-btn active" onclick="cambiarTab('Nueva solicitud')" id="tab-Nueva solicitud"><i data-lucide="plus-circle" style="width: 16px;"></i> Nueva solicitud</button>
                    <button class="tab-btn" onclick="cambiarTab('Guardados')" id="tab-Guardados">Guardados <span class="tab-badge" id="badge-Borrador">0</span></button>
                    <button class="tab-btn" onclick="cambiarTab('Realizados')" id="tab-Realizados">Realizados <span class="tab-badge" id="badge-Realizado">0</span></button>
                </div>

                <div id="dashboard-solicitudes" style="display: none;">
                    <div class="data-table-container">
                        <table>
                            <thead><tr><th>Proyecto</th><th>Concepto</th><th>Fecha</th><th>Acción</th></tr></thead>
                            <tbody id="tabla-mis-solicitudes"><tr><td colspan="4" style="padding: 30px; color: var(--text-muted);">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>

                <form id="formAdicionales" style="display: block;">
                    <input type="hidden" id="doc_id_actual" value="">
                    
                    <div class="form-card" style="border-left: 4px solid var(--primary-blue);">
                        <h3 class="section-title-form"><i data-lucide="file-question"></i> Tipo de solicitud</h3>
                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">¿Es una solicitud de adicionales / extraordinarios?</label>
                                <select class="form-select" id="tipo_solicitud">
                                    <option value="Adicionales">Adicionales</option>
                                    <option value="Extraordinarios">Extraordinarios</option>
                                    <option value="Deductivas">Deductivas</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">¿A qué proyecto se refiere?</label>
                                <input type="text" class="form-input" id="proyecto" placeholder="Nombre del proyecto...">
                            </div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="clipboard-list"></i> Datos de la solicitud</h3>
                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">Partida</label>
                                <input type="text" class="form-input" id="partida" placeholder="Ej. Tablaroca...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Fecha</label>
                                <input type="date" class="form-input" id="fecha_solicitud">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Justificación de la solicitud</label>
                            <textarea class="form-input" id="justificacion" rows="3" placeholder="Describe el motivo de la solicitud..."></textarea>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">Ubicación</label>
                                <input type="text" class="form-input" id="ubicacion" placeholder="Ej. Área de basura...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Clave</label>
                                <input type="text" class="form-input" id="clave" placeholder="Ej. ARQ-001...">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Concepto</label>
                            <input type="text" class="form-input" id="concepto" placeholder="Ej. Suministro y colocación de cubierta...">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Localización en proyecto</label>
                            <input type="text" class="form-input" id="localizacion_proyecto" placeholder="Ej. Nivel 1, Cuerpo B...">
                        </div>
                    </div>

                    <div class="form-card" style="border: 2px solid var(--primary-blue);">
                        <h3 class="section-title-form"><i data-lucide="calculator"></i> Cuantificaciones</h3>
                        <div class="form-group">
                            <label class="form-label">Unidad</label>
                            <select class="form-select" id="unidad">
                                <option value="M2">M2</option>
                                <option value="M3">M3</option>
                                <option value="Pza">Pza</option>
                                <option value="Lts">Lts</option>
                                <option value="Kg">Kg</option>
                                <option value="Ml">Ml</option>
                                <option value="Global">Global</option>
                            </select>
                        </div>
                        <div class="grid-4">
                            <div class="form-group">
                                <label class="form-label">Largo</label>
                                <input type="number" step="0.01" class="form-input" id="largo" oninput="calcularResultado()" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ancho</label>
                                <input type="number" step="0.01" class="form-input" id="ancho" oninput="calcularResultado()" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Alto</label>
                                <input type="number" step="0.01" class="form-input" id="alto" oninput="calcularResultado()" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Pzas</label>
                                <input type="number" step="1" class="form-input" id="pzas" oninput="calcularResultado()" placeholder="0">
                            </div>
                        </div>
                        
                        <div class="grid-3" style="margin-top: 20px;">
                            <div class="math-result">
                                <label>Resultado</label>
                                <span id="resultado_val">0.00</span>
                            </div>
                            <div class="form-group" style="margin:0; display:flex; flex-direction:column; justify-content:flex-end;">
                                <label class="form-label">Parcial</label>
                                <input type="number" step="0.01" class="form-input" id="parcial" oninput="calcularTotal()" placeholder="$0.00">
                            </div>
                            <div class="math-result" style="background: #f1f5f9; border-color: #cbd5e1;">
                                <label>Total</label>
                                <span id="total_val" style="color: var(--text-main);">$0.00</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="message-square"></i> Observaciones</h3>
                        <div class="form-group" style="margin-bottom: 0;">
                            <textarea class="form-input" id="observaciones" rows="3" placeholder="Notas adicionales..."></textarea>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="camera"></i> Evidencia fotográfica (Máx 3)</h3>
                        <div class="photo-controls">
                            <button type="button" class="btn-photo" onclick="triggerCamera('evidencia')"><i data-lucide="camera"></i> Toma Foto</button>
                            <button type="button" class="btn-photo-secondary" onclick="triggerFile('evidencia')"><i data-lucide="upload"></i> Subir Archivo</button>
                        </div>
                        <div id="photoGridEvidencia" class="photo-grid-slots">
                            <div class="photo-slot" id="slot-evidencia-0"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-evidencia-1"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                            <div class="photo-slot" id="slot-evidencia-2"><i data-lucide="image" style="color:#ccc; width:30px; height:30px;"></i></div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3 class="section-title-form"><i data-lucide="pen-tool"></i> Firma</h3>
                        <div class="form-group">
                            <div class="signature-container"><canvas id="firma_residente" class="signature-pad"></canvas></div>
                            <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
                                <button type="button" onclick="limpiarFirma('firma_residente')" style="padding: 6px 12px; font-size: 13px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--danger); background: white; color: var(--danger); cursor:pointer; font-weight: 600;">
                                    <i data-lucide="eraser" style="width: 14px; height: 14px;"></i> Limpiar
                                </button>
                            </div>
                            <input type="hidden" id="firma_residente_data">
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px; max-width: 400px; margin-left: auto; margin-right: auto; padding-bottom: 40px;">
                        <button type="button" id="btn-guardar-borrador" class="btn-guardar" onclick="procesarSolicitud('Borrador')"><i data-lucide="save"></i> Guardar solicitud</button>
                        <button type="button" id="btn-enviar-orden" class="btn-enviar" onclick="procesarSolicitud('En proceso')"><i data-lucide="send"></i> Enviar solicitud</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <input type="file" id="fileInputGlobal" accept="image/*" style="display:none" onchange="processFile(this)">
    <canvas id="tempCanvas" style="display:none"></canvas>
    <div id="camera-overlay">
        <div id="camera-stream"><video id="camera-video" autoplay="true" playsinline></video></div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button onclick="closeCamera()" style="padding:10px 20px; border-radius:6px; border:1px solid #d1d5db; background:white; cursor:pointer; font-weight:bold;">Cerrar</button>
            <button onclick="switchCamera()" style="padding:10px 20px; border-radius:6px; border:1px solid #d1d5db; background:#f3f4f6; cursor:pointer; font-weight:bold;"><i data-lucide="refresh-cw"></i> Girar</button>
            <button onclick="captureFoto()" style="padding:10px 20px; border-radius:6px; background:var(--primary-blue); color:white; border:none; cursor:pointer; font-weight:bold;">Capturar</button>
        </div>
    </div>
    <div id="photoModal" class="modal-enlarger" onclick="closePhotoModal()"><img class="modal-content-img" id="imgFull"></div>
    <div id="custom-alert"><div class="modal-card-alert"><div id="alert-icon-container"></div><h3 id="alert-title"></h3><p id="alert-msg"></p><button id="alert-btn" onclick="closeCustomAlert()">Aceptar</button></div></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDUM2w0L-3GNm0unSgKHZCrrW9xKQY0_is",
            authDomain: "franve-1b62e.firebaseapp.com",
            projectId: "franve-1b62e",
            storageBucket: "franve-1b62e.firebasestorage.app",
            messagingSenderId: "118420640551",
            appId: "1:118420640551:web:9b79daa79a2d46eefe4f02"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let appData = { nombre: 'Residente', usuario: 'demo' };
        let misSolicitudes = [], tabActual = 'Nueva solicitud';
        let fotos = { evidencia: [null, null, null] };

        document.addEventListener('DOMContentLoaded', () => {
            const usuario = localStorage.getItem('usuario'), nombre = localStorage.getItem('nombre');
            if (!usuario) { window.location.href = 'index.html'; return; }
            appData.usuario = usuario; appData.nombre = nombre || 'Residente';
            document.getElementById('user-initial-header').innerText = appData.nombre.charAt(0).toUpperCase();
            document.getElementById('user-dropdown-name').innerText = appData.nombre;

            fetch('menu.html?v=2').then(res => res.text()).then(html => {
                document.getElementById('sidebar').innerHTML = html; lucide.createIcons();
                const link = document.getElementById('link-adicionales'); if(link) link.classList.add('active');
            }).catch(() => {
                document.getElementById('sidebar').innerHTML = `<nav class="sidebar-nav"><div class="sidebar-section"><span class="section-title">Navegación</span><a href="#" class="nav-item active" id="link-adicionales"><i data-lucide="file-text" style="width:18px;height:18px;"></i> Adicionales</a></div></nav>`;
                lucide.createIcons();
            });
            document.getElementById('toggle-menu').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('open'); });
            window.addEventListener('click', (e) => { if (!e.target.matches('#user-initial-header')) { const dd = document.getElementById('user-dropdown'); if(dd.classList.contains('show')) dd.classList.remove('show'); } });
            
            inicializarFirma(); 
            cargarMisSolicitudes();
            lucide.createIcons();
        });

        function cargarMisSolicitudes() {
            db.collection("solicitudes_adicionales").where("residente_id","==",appData.usuario).get().then(q => {
                misSolicitudes = [];
                q.forEach(d => { misSolicitudes.push({ id_doc: d.id, ...d.data() }); });
                misSolicitudes.sort((a, b) => (b.fecha_creacion || "").localeCompare(a.fecha_creacion || ""));
                actualizarBadges();
                if(tabActual !== 'Nueva solicitud') renderTablaMisSolicitudes();
            }).catch(e => console.error(e));
        }

        function actualizarBadges() {
            let b=0, r=0;
            misSolicitudes.forEach(o => { if(o.estado==='Borrador') b++; else if(o.estado==='En proceso') r++; });
            document.getElementById('badge-Borrador').innerText = b;
            document.getElementById('badge-Realizado').innerText = r;
        }

        function cambiarTab(e, isEdit=false) {
            tabActual = e;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const a = document.getElementById(`tab-${e}`); if(a) a.classList.add('active');
            if(e === 'Nueva solicitud') {
                document.getElementById('dashboard-solicitudes').style.display = 'none';
                document.getElementById('formAdicionales').style.display = 'block';
                if(!isEdit) mostrarFormularioNuevaSolicitud();
            } else {
                document.getElementById('formAdicionales').style.display = 'none';
                document.getElementById('dashboard-solicitudes').style.display = 'block';
                renderTablaMisSolicitudes();
            }
        }

        function renderTablaMisSolicitudes() {
            const t = document.getElementById('tabla-mis-solicitudes'); t.innerHTML = '';
            let f = misSolicitudes.filter(o => {
                if(tabActual==='Guardados' && o.estado!=='Borrador') return false;
                if(tabActual==='Realizados' && o.estado!=='En proceso') return false;
                return true;
            });
            if(f.length===0) { t.innerHTML=`<tr><td colspan="4" style="padding:30px;color:var(--text-muted)">Sin solicitudes</td></tr>`; return; }
            f.forEach(o => {
                const r = document.createElement('tr');
                r.innerHTML = `
                    <td style="font-weight:bold">${o.proyecto||''}</td>
                    <td>${o.concepto||''}</td>
                    <td>${o.fecha||''}</td>
                    <td>
                        ${o.estado === 'Borrador' ? `<button type="button" onclick="cargarBorrador('${o.id_doc}')" class="btn-edit"><i data-lucide="edit-2" style="width:14px"></i> Editar</button>` : `<button type="button" onclick="verPDFSolicitud('${o.id_doc}')" style="background:var(--primary-blue); color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold; display:inline-flex; align-items:center; gap:5px; font-size:13px;"><i data-lucide="file-text" style="width:14px"></i> PDF</button>`}
                    </td>`;
                t.appendChild(r);
            });
            lucide.createIcons();
        }

        function mostrarFormularioNuevaSolicitud() {
            document.getElementById('formAdicionales').reset();
            document.getElementById('doc_id_actual').value = '';
            document.getElementById('resultado_val').innerText = '0.00';
            document.getElementById('total_val').innerText = '$0.00';
            fotos = { evidencia: [null, null, null] };
            renderSlots('evidencia');
            limpiarFirma('firma_residente');
        }

        function cargarBorrador(id) {
            const o = misSolicitudes.find(x => x.id_doc === id); if(!o) return;
            cambiarTab('Nueva solicitud', true);
            document.getElementById('doc_id_actual').value = o.id_doc;
            document.getElementById('tipo_solicitud').value = o.tipo_solicitud || 'Adicionales';
            document.getElementById('proyecto').value = o.proyecto || '';
            document.getElementById('partida').value = o.partida || '';
            document.getElementById('fecha_solicitud').value = o.fecha || '';
            document.getElementById('justificacion').value = o.justificacion || '';
            document.getElementById('ubicacion').value = o.ubicacion || '';
            document.getElementById('clave').value = o.clave || '';
            document.getElementById('concepto').value = o.concepto || '';
            document.getElementById('localizacion_proyecto').value = o.localizacion_proyecto || '';
            document.getElementById('unidad').value = o.unidad || 'M2';
            document.getElementById('largo').value = o.largo || '';
            document.getElementById('ancho').value = o.ancho || '';
            document.getElementById('alto').value = o.alto || '';
            document.getElementById('pzas').value = o.pzas || '';
            document.getElementById('resultado_val').innerText = o.resultado || '0.00';
            document.getElementById('parcial').value = o.parcial || '';
            document.getElementById('total_val').innerText = o.total ? '$' + o.total.toFixed(2) : '$0.00';
            document.getElementById('observaciones').value = o.observaciones || '';
            
            fotos.evidencia = o.urls_evidencia && o.urls_evidencia.length ? [...o.urls_evidencia] : [null, null, null];
            while(fotos.evidencia.length < 3) fotos.evidencia.push(null);
            renderSlots('evidencia');

            if(o.url_firma) {
                document.getElementById('firma_residente_data').value = o.url_firma;
                const img = new Image();
                img.onload = () => { if(ctxFirma) ctxFirma.drawImage(img,0,0) };
                img.src = o.url_firma;
            } else { limpiarFirma('firma_residente'); }
        }

        function calcularResultado() {
            const l = parseFloat(document.getElementById('largo').value) || 0;
            const a = parseFloat(document.getElementById('ancho').value) || 0;
            const al = parseFloat(document.getElementById('alto').value) || 0;
            const p = parseFloat(document.getElementById('pzas').value) || 1;
            let res = l * a;
            if(al > 0) res *= al;
            if(p > 0) res *= p;
            document.getElementById('resultado_val').innerText = res.toFixed(2);
            calcularTotal();
        }

        function calcularTotal() {
            const res = parseFloat(document.getElementById('resultado_val').innerText) || 0;
            const par = parseFloat(document.getElementById('parcial').value) || 0;
            const tot = res * par;
            document.getElementById('total_val').innerText = '$' + tot.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // ══════════════════════════════════════════════════════════
        // GUARDAR BASE64 DIRECTO A FIRESTORE (IGUAL QUE FRANVE)
        // Ya NO sube a Storage. Instantáneo.
        // ══════════════════════════════════════════════════════════
        async function procesarSolicitud(est) {
            const g = document.getElementById('btn-guardar-borrador'), e = document.getElementById('btn-enviar-orden');
            const cf = document.getElementById('firma_residente'), fv = document.createElement('canvas');
            fv.width=cf.width; fv.height=cf.height;
            
            if(est === 'En proceso') {
                const p = document.getElementById('proyecto').value, c = document.getElementById('concepto').value;
                if(!p || !c) { showCustomAlert("Atención","Completa Proyecto y Concepto.",false); return; }
                if(cf.toDataURL()===fv.toDataURL() && !document.getElementById('firma_residente_data').value){ showCustomAlert("Atención","La firma es obligatoria.",false); return; }
            }
            if(cf.toDataURL()!==fv.toDataURL()) document.getElementById('firma_residente_data').value=cf.toDataURL();

            g.disabled=true; e.disabled=true; g.innerText='Guardando...'; e.innerText='Guardando...';

            try {
                // Guardar base64 directo, SIN subir a Storage
                const data = {
                    tipo_solicitud: document.getElementById('tipo_solicitud').value,
                    proyecto: document.getElementById('proyecto').value,
                    partida: document.getElementById('partida').value,
                    fecha: document.getElementById('fecha_solicitud').value,
                    justificacion: document.getElementById('justificacion').value,
                    ubicacion: document.getElementById('ubicacion').value,
                    clave: document.getElementById('clave').value,
                    concepto: document.getElementById('concepto').value,
                    localizacion_proyecto: document.getElementById('localizacion_proyecto').value,
                    unidad: document.getElementById('unidad').value,
                    largo: parseFloat(document.getElementById('largo').value) || 0,
                    ancho: parseFloat(document.getElementById('ancho').value) || 0,
                    alto: parseFloat(document.getElementById('alto').value) || 0,
                    pzas: parseFloat(document.getElementById('pzas').value) || 0,
                    resultado: parseFloat(document.getElementById('resultado_val').innerText) || 0,
                    parcial: parseFloat(document.getElementById('parcial').value) || 0,
                    total: parseFloat(document.getElementById('total_val').innerText.replace('$','').replace(/,/g,'')) || 0,
                    observaciones: document.getElementById('observaciones').value,
                    // BASE64 DIRECTO (igual que FRANVE)
                    urls_evidencia: fotos.evidencia.filter(f => f !== null),
                    url_firma: document.getElementById('firma_residente_data').value || null,
                    residente_id: appData.usuario,
                    residente_nombre: appData.nombre,
                    estado: est,
                    fecha_creacion: new Date().toISOString()
                };

                const did = document.getElementById('doc_id_actual').value || `ADIC-${Date.now()}`;
                await db.collection("solicitudes_adicionales").doc(did).set(data, {merge: true});
                showCustomAlert("Éxito", est==='Borrador'?"Guardado correctamente.":"Enviado correctamente.", true);
                cargarMisSolicitudes();
                cambiarTab(est==='Borrador'?'Guardados':'Realizados');
            } catch(err) {
                console.error(err);
                showCustomAlert("Error", "Ocurrió un error al guardar.", false);
            } finally {
                g.disabled=false; e.disabled=false;
                g.innerHTML='<i data-lucide="save"></i> Guardar solicitud';
                e.innerHTML='<i data-lucide="send"></i> Enviar solicitud';
                lucide.createIcons();
            }
        }

        // ══════════════════════════════════════════════════════════
        // PDF INSTANTÁNEO (IGUAL QUE FRANVE)
        // Los datos ya son base64, sin conversión, sin contador.
        // ══════════════════════════════════════════════════════════
        function verPDFSolicitud(id) {
            const o = misSolicitudes.find(x => x.id_doc === id); 
            if(!o) { showCustomAlert("Error", "Solicitud no encontrada.", false); return; }

            // Pasar base64 directamente (igual que FRANVE)
            const data = {
                folio: o.id_doc || '',
                fecha: o.fecha || '',
                tipo_solicitud: o.tipo_solicitud || '',
                proyecto: o.proyecto || '',
                partida: o.partida || '',
                justificacion: o.justificacion || '',
                clave: o.clave || '',
                concepto: o.concepto || '',
                localizacion_proyecto: o.localizacion_proyecto || '',
                unidad: o.unidad || '',
                largo: o.largo || '0',
                ancho: o.ancho || '0',
                alto: o.alto || '0',
                pzas: o.pzas || '0',
                resultado: o.resultado || '0.00',
                parcial: o.parcial ? '$' + o.parcial.toFixed(2) : '$0.00',
                total: o.total ? '$' + o.total.toFixed(2) : '$0.00',
                observaciones: o.observaciones || '',
                residente_nombre: o.residente_nombre || '',
                fotos_evidencia: (o.urls_evidencia || []).concat([null, null, null, null]).slice(0, 4),
                firma: o.url_firma || null
            };

            sessionStorage.setItem('DatosAdicionalPDF', JSON.stringify(data));
            window.open('pdf_reporte_adicionales.html', '_blank');
        }

        // ══════════════════════════════════════════════════════════
        // FOTOS, FIRMA Y UTILIDADES
        // ══════════════════════════════════════════════════════════
        function showCustomAlert(t, m, s=true) { const a = document.getElementById('custom-alert'); document.getElementById('alert-title').innerText=t; document.getElementById('alert-msg').innerText=m; const i = document.getElementById('alert-icon-container'), b = document.getElementById('alert-btn'); if(s){i.innerHTML='<i data-lucide="check-circle" style="width:48px;height:48px;color:var(--success)"></i>';b.style.background='var(--success)';}else{i.innerHTML='<i data-lucide="alert-triangle" style="width:48px;height:48px;color:var(--danger)"></i>';b.style.background='var(--danger)';} a.style.display='flex'; lucide.createIcons(); }
        function closeCustomAlert() { document.getElementById('custom-alert').style.display = 'none'; }

        let activeTarget='evidencia',currentFacingMode='environment';
        function triggerFile(t){activeTarget=t;if(fotos[t].filter(f=>f!==null).length<fotos[t].length)document.getElementById('fileInputGlobal').click();else window.alert("Límite alcanzado.");}
        function processFile(i){if(!i.files||i.files.length===0)return;const r=new FileReader();r.onload=function(e){const img=new Image();img.onload=function(){const c=document.createElement('canvas');let w=img.width,h=img.height;const m=800;if(w>m||h>m){if(w>h){h=(h/w)*m;w=m}else{w=(w/h)*m;h=m}}c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);const f=c.toDataURL('image/jpeg',0.7);const s=fotos[activeTarget].findIndex(f=>f===null);if(s>-1){fotos[activeTarget][s]=f;renderSlots(activeTarget)}i.value=''};img.src=e.target.result};r.readAsDataURL(i.files[0])}
        let currentStream;
        async function triggerCamera(t){activeTarget=t;if(fotos[t].filter(f=>f!==null).length>=fotos[t].length){window.alert("Límite alcanzado.");return}currentFacingMode='environment';await startCamera()}
        async function startCamera(){if(currentStream){currentStream.getTracks().forEach(t=>t.stop())}try{currentStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:currentFacingMode}});document.getElementById('camera-video').srcObject=currentStream;document.getElementById('camera-overlay').classList.add('show')}catch(e){window.alert("Cámara no disponible.")}}
        function switchCamera(){currentFacingMode=currentFacingMode==='environment'?'user':'environment';startCamera()}
        function closeCamera(){if(currentStream){currentStream.getTracks().forEach(t=>t.stop())}document.getElementById('camera-overlay').classList.remove('show')}
        function captureFoto(){const c=document.getElementById('tempCanvas'),v=document.getElementById('camera-video');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);const s=fotos[activeTarget].findIndex(f=>f===null);if(s>-1){fotos[activeTarget][s]=c.toDataURL('image/jpeg',0.8);renderSlots(activeTarget)}closeCamera()}
        function removeFoto(t,i){fotos[t][i]=null;renderSlots(t)}
        function enlargePhoto(s){document.getElementById('imgFull').src=s;document.getElementById('photoModal').classList.add('show')}
        function closePhotoModal(){document.getElementById('photoModal').classList.remove('show')}
        function renderSlots(t){for(let i=0;i<fotos[t].length;i++){const s=document.getElementById(`slot-${t}-${i}`);if(!s)continue;if(fotos[t][i]){s.innerHTML=`<img src="${fotos[t][i]}" onclick="enlargePhoto(this.src)" style="width:100%;height:100%;object-fit:cover;cursor:zoom-in;border-radius:8px"><span class="remove-photo" onclick="removeFoto('${t}',${i})">&times;</span>`;s.style.border="1px solid var(--border-color)"}else{s.innerHTML=`<i data-lucide="image" style="color:#ccc;width:30px;height:30px"></i>`;s.style.border="2px dashed #d1d5db"}}lucide.createIcons()}

        let canvasFirma,ctxFirma;
        function inicializarFirma(){canvasFirma=document.getElementById('firma_residente');if(!canvasFirma)return;ctxFirma=canvasFirma.getContext('2d');canvasFirma.width=600;canvasFirma.height=200;ctxFirma.lineWidth=3;ctxFirma.lineCap='round';ctxFirma.strokeStyle='#263fa4';let d=false;function g(e){const r=canvasFirma.getBoundingClientRect();const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-r.left)*(canvasFirma.width/r.width),y:(cy-r.top)*(canvasFirma.height/r.height)}}canvasFirma.addEventListener('mousedown',e=>{d=true;const p=g(e);ctxFirma.beginPath();ctxFirma.moveTo(p.x,p.y)});canvasFirma.addEventListener('mousemove',e=>{if(d){const p=g(e);ctxFirma.lineTo(p.x,p.y);ctxFirma.stroke()}});window.addEventListener('mouseup',()=>{if(d){d=false;document.getElementById('firma_residente_data').value=canvasFirma.toDataURL()}});canvasFirma.addEventListener('touchstart',e=>{e.preventDefault();d=true;const p=g(e);ctxFirma.beginPath();ctxFirma.moveTo(p.x,p.y)},{passive:false});canvasFirma.addEventListener('touchmove',e=>{e.preventDefault();if(d){const p=g(e);ctxFirma.lineTo(p.x,p.y);ctxFirma.stroke()}},{passive:false});window.addEventListener('touchend',()=>{if(d){d=false;document.getElementById('firma_residente_data').value=canvasFirma.toDataURL()}})}
        function limpiarFirma(id){if(ctxFirma)ctxFirma.clearRect(0,0,canvasFirma.width,canvasFirma.height);document.getElementById(id+'_data').value=''}
    </script>
</body>
</html>
