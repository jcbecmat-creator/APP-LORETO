<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reporte Semanal | Loreto Ingeniería</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary-blue: #263fa4; --light-blue: #eef2ff; --bg-color: #f8fafc;
            --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- LAYOUT --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: white; border-bottom: 1px solid var(--border-color); z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .header-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary-blue); }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); overflow-y: auto; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        @media (max-width: 768px) { .sidebar { position: fixed; height: calc(100vh - 60px); transform: translateX(-100%); z-index: 40; } .sidebar.open { transform: translateX(0); } }

        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .container { max-width: 98%; margin: 0 auto; }
        
        /* --- FILTROS --- */
        .filters-bar { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;}
        .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
        .filter-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        .form-input { padding: 0 16px; height: 42px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: var(--text-main); width: 100%; box-sizing: border-box; background: var(--bg-color); }
        
        .btn-primary { background: var(--primary-blue); color: white; border: none; height: 42px; padding: 0 24px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

        /* --- TABLA --- */
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border-color); background: white;}
        .data-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .data-table th { background-color: var(--light-blue); color: var(--primary-blue); font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 14px 15px; text-align: left; }
        .data-table td { padding: 14px 15px; border-bottom: 1px solid var(--border-color); font-size: 13px; color: var(--text-main); }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="toggle-menu"><i data-lucide="menu"></i></button>
            <h1 class="header-title">Reporte Semanal</h1>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="container">
                <div class="page-header" style="margin-bottom: 25px;">
                    <h1>Reporte Semanal</h1>
                    <p style="color: var(--text-muted);">Gestiona los informes de avances semanales.</p>
                </div>

                <div class="filters-bar">
                    <div class="filter-group">
                        <label class="filter-label">Fecha Inicio</label>
                        <input type="date" class="form-input" id="filtro-inicio">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Fecha Término</label>
                        <input type="date" class="form-input" id="filtro-fin">
                    </div>
                    <button class="btn-primary" onclick="filtrarReportes()">
                        <i data-lucide="search"></i> Buscar
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Semana</th>
                                <th>Sucursal</th>
                                <th>Avance (%)</th>
                                <th>Estatus</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDkwUT5MrsJV2IMp18-RT20829M9c3-zfk",
        authDomain: "loreto-ingenieria.firebaseapp.com",
        projectId: "loreto-ingenieria",
        storageBucket: "loreto-ingenieria.firebasestorage.app",
        messagingSenderId: "873434501512",
        appId: "1:873434501512:web:963903379a5e72cb092a3d"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('DOMContentLoaded', () => {
        // Cargar menú
        fetch('menu.html').then(res => res.text()).then(html => {
            document.getElementById('sidebar').innerHTML = html;
            lucide.createIcons();
            const link = document.getElementById('link-reporte-semanal');
            if(link) link.classList.add('active');
        });

        document.getElementById('toggle-menu').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
    });

    function filtrarReportes() {
        console.log("Buscando reportes...");
        // Aquí agregarías la lógica de filtrado de Firestore
    }
</script>
</body>
</html>
